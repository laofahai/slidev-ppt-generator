name: Publish to ClawHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Authenticate and Publish
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          npx -y @clawhub/cli login --token $CLAWHUB_TOKEN
          npx -y @clawhub/cli publish . \
            --slug slidev-ppt-generator \
            --name "Slidev PPT Generator" \
            --version ${GITHUB_REF_NAME#v} \
            --description "使用 Slidev 生成和导出演示文稿" \
            --tags "slidev,ppt,presentation,markdown,slides" \
            --changelog "Release ${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
